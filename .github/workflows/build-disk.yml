---
name: Build Beryllium disk image
on:
  schedule:
    - cron: "0 1 * * TUE"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build Beryllium
    branches:
      - main
    types:
      - completed

jobs:
  nvidia_gate:
    uses: ./.github/workflows/nvidia-gate.yaml

  build_release:
    name: Build and release disk image
    needs: nvidia_gate
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      packages: read
      id-token: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ["amd64"]
        flavor: ${{ fromJSON(needs.nvidia_gate.outputs.flavors) }}
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}

    steps:
      - name: Free disk space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2
        with:
          skip-if-available: "64G"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Build ISO
        id: build-iso
        env:
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/beryllium${{ matrix.flavor }}:latest-amd64
          TARGET_CONFIG: ${{ matrix.flavor == '-nvidia' && './iso-nvidia.toml' || './iso.toml' }}
        run: |
          sudo podman pull "${TARGET_IMAGE}"
          sudo mkdir -p rpm-gpg output
          sudo podman run --rm -v ./rpm-gpg:/out:Z "${TARGET_IMAGE}" bash -c 'if [ -d /etc/pki/rpm-gpg ]; then cp -a /etc/pki/rpm-gpg/. /out/; fi'
          RPM_GPG_MOUNT=()
          if [[ -n "$(find rpm-gpg -mindepth 1 -print -quit)" ]]; then
            RPM_GPG_MOUNT=(-v ./rpm-gpg/:/etc/pki/rpm-gpg/:ro)
          fi
          sudo podman run \
            --rm \
            --privileged \
            --pull=newer \
            --security-opt label=type:unconfined_t \
            -v "${TARGET_CONFIG}:/config.toml:ro" \
            -v ./output/:/output \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${RPM_GPG_MOUNT[@]}" \
            quay.io/centos-bootc/bootc-image-builder:latest --type iso --rootfs btrfs --use-librepo=True \
            "${TARGET_IMAGE}"
          echo "output-directory=$(realpath ./output)" >> $GITHUB_OUTPUT

      - name: Brand ISOs
        env:
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE_NAME: "beryllium"
          SOURCE_DIR: ${{ steps.build-iso.outputs.output-directory }}
        run: |
          sudo mv "${SOURCE_DIR}"/*/*.iso "${SOURCE_DIR}/beryllium-unbranded.iso"
          sudo podman rmi -a -f
          podman rmi -a -f
          sudo podman run \
            --rm \
            -it \
            --pull=newer \
            --privileged \
            -v /dev:/dev \
            -v "${SOURCE_DIR}:/output" \
            -v ./assets/iso:/iso \
            registry.fedoraproject.org/fedora:latest \
            bash -c 'dnf install -y lorax \
            && mkdir /images \
            && cd /iso/product && find . | cpio -c -o | gzip -9cv > /images/product.img && cd / \
            && mkksiso \
                --add /images \
                --volid beryllium-boot \
                --replace "vmlinuz" "vmlinuz inst.resolution=1280x800" \
                    /output/beryllium-unbranded.iso \
                    /output/beryllium.iso'
                  sudo mv "${SOURCE_DIR}"/beryllium.iso "${SOURCE_DIR}/${IMAGE_NAME}${FLAVOR}-${PLATFORM}.iso"
          (cd ${SOURCE_DIR} && sha256sum "${IMAGE_NAME}${FLAVOR}-${PLATFORM}.iso" | sudo tee "${IMAGE_NAME}${FLAVOR}-${PLATFORM}.iso-CHECKSUM")
          sudo rm -f "${SOURCE_DIR}/beryllium-unbranded.iso"

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: beryllium${{ matrix.flavor }}-${{ matrix.platform }}
          path: |
            ${{ steps.build-iso.outputs.output-directory }}/beryllium${{ matrix.flavor }}-${{ matrix.platform }}.iso
            ${{ steps.build-iso.outputs.output-directory }}/beryllium${{ matrix.flavor }}-${{ matrix.platform }}.iso-CHECKSUM
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FLAVOR: ${{ matrix.flavor }}
          PLATFORM: ${{ matrix.platform }}
          IMAGE_NAME: beryllium
          SOURCE_DIR: ${{ steps.build-iso.outputs.output-directory }}
        run: |
          TAG="iso-${GITHUB_RUN_NUMBER}${FLAVOR}"
          gh release create "${TAG}" \
            "${SOURCE_DIR}/${IMAGE_NAME}${FLAVOR}-${PLATFORM}.iso" \
            "${SOURCE_DIR}/${IMAGE_NAME}${FLAVOR}-${PLATFORM}.iso-CHECKSUM" \
            --target "${GITHUB_SHA}" \
            --title "Beryllium${FLAVOR} ISO ${GITHUB_RUN_NUMBER}" \
            --notes "Automated ISO build from ${GITHUB_SHA}."
