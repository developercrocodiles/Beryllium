[UKIProfile]
Profile=
        ID=emergency
        TITLE=Boot into Emergency Mode

Cmdline=
        root=dissect
        mount.usr=dissect
        systemd.unit=emergency.target
        rw
        audit=0
        systemd.image_policy=esp=unprotected:xbootldr=unprotected+unused+absent:usr=signed:root=encrypted+absent:swap=encrypted+unused+absent:home=unprotected+absent:=ignore
        systemd.image_filter=usr=Beryllium_*:usr-verity=Beryllium_*:usr-verity-sig=Beryllium_*:root=Beryllium-*:swap=Beryllium-*:home=Beryllium-*
        ipe.enforce=0

SignExpectedPcr=yes
